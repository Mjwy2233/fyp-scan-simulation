# ==============================================================================
# Mode 2 预设航点序列示例配置 (可由 keypoint_recorder.py 交互式录制生成)
# Example preset waypoint sequence for Mode 2 (generated by keypoint_recorder.py)
#
# 使用方式 / Usage:
#   ros2 launch scan_planner run.launch.py navi_mode:=2 \
#     keypoints_file:=/path/to/keypoints.yaml
# ==============================================================================

scan_planner_node:
  ros__parameters:
    # 导航模式固定为 2 (预设航点序列模式) / Navigation mode 2 (preset waypoint sequence)
    fsm.navi_mode: 2
    # 扁平化机身三维航点序列 [x0, y0, z0, x1, y1, z1, ...]，单位 m / Flat xyz waypoint list (m)
    fsm.waypoints: [0.0, 0.0, 0.3, 2.0, 0.0, 0.3]
